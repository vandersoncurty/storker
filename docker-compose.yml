services:
  backend:
    build: ./backend
    container_name: arsenal-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MOONRAKER_URL=http://host.docker.internal:7125
      - SPOOLMAN_URL=http://host.docker.internal:7912
    volumes:
      - backend-data:/app/data
      - ./backend/store.db:/app/store.db
      - ./backend/settings.json:/app/settings.json
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: arsenal-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
