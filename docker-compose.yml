services:
  backend:
    build: ./backend
    container_name: arsenal-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./store.db
      - MOONRAKER_URL=http://host.docker.internal:7125
      - SPOOLMAN_URL=http://host.docker.internal:7912
    volumes:
      - backend-data:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: arsenal-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
